<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0a0420"/>
<meta name="description" content="Una galaxia interactiva creada como regalo: cada estrella guarda un pensamiento de amor."/>
<meta name="robots" content="noindex, nofollow"/>
<title>Nuestra Galaxia del Amor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<!-- ══════════════════════════════════
     INTRO — transición de entrada
     ══════════════════════════════════ -->
<div id="intro" aria-hidden="true">
  <div class="intro-stars" id="introStars"></div>
  <div class="intro-content">
    <h1 class="intro-title">Nuestra Galaxia</h1>
    <p class="intro-sub">Cada estrella guarda un pedacito de lo que siento por ti.</p>
    <button id="introBtn" class="btn-entrar">Entrar ✦</button>
  </div>
</div>

<!-- Volver a la página principal del regalo -->
<a id="btnVolver" class="btn-volver" href="../index.html" aria-label="Volver a la página principal">← Volver</a>

<!-- ══════════════════════════════════
     LIENZO PRINCIPAL — la galaxia
     ══════════════════════════════════ -->
<canvas id="galaxyCanvas" aria-label="Galaxia interactiva de estrellas"></canvas>

<!-- Pista visual sutil la primera vez -->
<div id="hint" class="hint" aria-hidden="true">Arrastra para explorar · pellizca o usa la rueda para zoom</div>

<!-- ══════════════════════════════════
     TARJETA DE MENSAJE (glassmorphism)
     ══════════════════════════════════ -->
<div id="card" class="card" role="dialog" aria-modal="true" aria-label="Mensaje de una estrella" aria-hidden="true">
  <div class="card-inner">
    <button class="card-close" id="cardClose" aria-label="Cerrar mensaje">✕</button>
    <p class="card-day" id="cardDay">Día 1</p>
    <p class="card-msg" id="cardMsg"></p>
    <div class="card-nav">
      <button id="cardPrev" aria-label="Mensaje anterior">← Anterior</button>
      <button id="cardNext" aria-label="Mensaje siguiente">Siguiente →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     CONTROLES DE NAVEGACIÓN
     ══════════════════════════════════ -->
<nav class="hud" aria-label="Controles de la galaxia">
  <button id="btnHome" title="Inicio" aria-label="Volver al inicio">🏠</button>
  <button id="btnZoomOut" title="Alejar" aria-label="Alejar">−</button>
  <button id="btnZoomIn" title="Acercar" aria-label="Acercar">+</button>
  <button id="btnRandom" title="Estrella aleatoria" aria-label="Buscar estrella aleatoria">🎲</button>
  <button id="btnCenter" title="Centro de la galaxia" aria-label="Ir al centro de la galaxia">◎</button>
  <button id="btnFullscreen" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
  <button id="btnMusic" title="Música" aria-label="Activar o desactivar música">♪</button>
</nav>

<script src="script.js"></script>
</body>
</html>
