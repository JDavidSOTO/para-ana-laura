name: Recordatorios diarios

on:
  schedule:
    # 05:00 hora de Colombia (UTC-5) = 10:00 UTC — solo para recordatorios especiales
    - cron: '0 10 * * *'
    # 09:00 hora de Colombia (UTC-5) = 14:00 UTC — horario normal
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  revisar-recordatorios:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install
        working-directory: scripts
      - name: Determinar a qué hora corresponde esta ejecución
        id: hora
        run: |
          if [ "${{ github.event.schedule }}" == "0 10 * * *" ]; then
            echo "hora=05:00" >> "$GITHUB_OUTPUT"
          else
            echo "hora=09:00" >> "$GITHUB_OUTPUT"
          fi
      - name: Revisar y enviar recordatorios de hoy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HORA_EJECUTAR: ${{ steps.hora.outputs.hora }}
        run: node scripts/send-reminders.js
      - name: Guardar reminders.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet reminders.json || (git add reminders.json && git commit -m "chore: marcar recordatorio como enviado" && git push)
